services:
  - type: worker
    name: newlife-discord-bot
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    maxShutdownDelaySeconds: 120
    envVars:
      - key: UNIFIED_DISCORD_TOKEN
        sync: false
      - key: UNIFIED_CLIENT_ID
        sync: false
      - key: UNIFIED_DEVELOPER_ID
        sync: false
      - key: UNIFIED_GUILD_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: newlife-postgres
          property: connectionString
      - key: POSTGRES_SYNC_ENABLED
        value: "true"
      - key: POSTGRES_SNAPSHOT_ID
        value: newlife-production
      - key: POSTGRES_SYNC_INTERVAL_MS
        value: "10000"
      - key: POSTGRES_HISTORY_KEEP
        value: "5"

databases:
  - name: newlife-postgres
    postgresMajorVersion: "18"
    plan: basic-256mb
    databaseName: newlife
    user: newlife_bot
    ipAllowList: []